<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>江恩理论 A股预测终端</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="left-tools">
        <button class="tool-btn active" data-tool="crosshair" aria-pressed="true">十字</button>
        <button class="tool-btn" data-tool="trendline" aria-pressed="false">趋势线</button>
        <button class="tool-btn" data-tool="horizontal" aria-pressed="false">水平线</button>
        <button class="tool-btn" data-tool="undo" aria-pressed="false">撤销</button>
        <button class="tool-btn" data-tool="clear" aria-pressed="false">清空</button>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div class="brand-block">
            <div class="brand-kicker">GANN LAB</div>
            <div class="brand-title">A股江恩理论预测终端</div>
          </div>

          <div class="topbar-right">
            <form id="controlForm" class="controls">
              <label>
                股票代码
                <input id="symbolInput" type="text" value="600519" maxlength="6" />
              </label>
              <label>
                周期
                <select id="periodSelect">
                  <option value="daily">日线</option>
                  <option value="weekly">周线</option>
                  <option value="monthly">月线</option>
                </select>
              </label>
              <label>
                复权
                <select id="adjustedSelect">
                  <option value="forward">前复权</option>
                  <option value="none">不复权</option>
                  <option value="backward">后复权</option>
                </select>
              </label>
              <button type="submit" class="primary-btn">加载分析</button>
            </form>

            <div class="header-actions">
              <a
                class="repo-link"
                href="https://github.com/oficcejo/stock-gann"
                target="_blank"
                rel="noreferrer"
                aria-label="打开 GitHub 仓库"
                title="GitHub 仓库"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    fill="currentColor"
                    d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.57.1.78-.24.78-.54 0-.27-.01-.98-.02-1.92-3.2.69-3.88-1.54-3.88-1.54-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.71 1.25 3.37.96.1-.75.4-1.25.73-1.54-2.55-.29-5.23-1.28-5.23-5.68 0-1.25.45-2.27 1.18-3.07-.12-.29-.51-1.47.11-3.06 0 0 .96-.31 3.14 1.17a10.9 10.9 0 0 1 5.72 0c2.18-1.48 3.14-1.17 3.14-1.17.62 1.59.23 2.77.11 3.06.73.8 1.18 1.82 1.18 3.07 0 4.41-2.69 5.39-5.25 5.67.41.35.78 1.04.78 2.1 0 1.52-.01 2.75-.01 3.12 0 .3.21.65.79.54A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"
                  />
                </svg>
                <span>GitHub</span>
              </a>
              <button id="openAiModalBtn" type="button" class="ghost-btn">AI 分析报告</button>
            </div>
          </div>
        </header>

        <section id="chartFrame" class="chart-frame">
          <div class="chart-toolbar">
            <div class="toolbar-title">
              <span id="securityName">贵州茅台</span>
              <span id="securityMeta">600519.SH · 日线</span>
            </div>
            <div class="toolbar-actions">
              <div class="chart-tool-group" aria-label="画线工具">
                <button type="button" class="tool-btn toolbar-tool active" data-tool="crosshair" aria-pressed="true">十字</button>
                <button type="button" class="tool-btn toolbar-tool" data-tool="trendline" aria-pressed="false">趋势线</button>
                <button type="button" class="tool-btn toolbar-tool" data-tool="horizontal" aria-pressed="false">水平线</button>
                <button type="button" class="tool-btn toolbar-tool" data-tool="undo" aria-pressed="false">撤销</button>
                <button type="button" class="tool-btn toolbar-tool" data-tool="clear" aria-pressed="false">清空</button>
              </div>
              <button type="button" class="pill is-active" data-overlay="trend">Trend</button>
              <button type="button" class="pill is-active" data-overlay="fan">Gann Fan</button>
              <button type="button" class="pill is-active" data-overlay="time">Time Cycles</button>
              <button type="button" class="pill is-active" data-overlay="level">Price Levels</button>
              <button id="toggleFullscreenBtn" type="button" class="ghost-btn toolbar-btn">全屏图表</button>
            </div>
          </div>

          <div id="chart" class="chart-canvas">
            <svg id="drawingLayer" class="drawing-layer" aria-hidden="true"></svg>
            <div id="drawingHint" class="drawing-hint">十字模式：可拖动缩放图表。选择“趋势线”或“水平线”后可在图上标注。</div>
          </div>
        </section>
      </main>

      <aside class="right-panel">
        <section class="panel-card hero-card">
          <div class="panel-label">预测结论</div>
          <div id="trendBias" class="hero-value">--</div>
          <div id="forecastText" class="hero-text">等待加载分析数据。</div>
          <div class="hero-actions">
            <button id="quickAiBtn" type="button" class="primary-btn">打开 AI 报告</button>
          </div>
        </section>

        <section class="panel-card compact-card">
          <div class="panel-label">状态</div>
          <p id="statusText">等待图表加载。</p>
        </section>

        <section class="panel-card compact-card">
          <div class="panel-label">看图方法</div>
          <div id="guideList" class="summary-list"></div>
        </section>

        <section class="panel-card compact-card">
          <div class="panel-label">关键价格位</div>
          <div id="priceLevels" class="metric-list"></div>
        </section>

        <section class="panel-card compact-card">
          <div class="panel-label">时间窗口</div>
          <div id="timeCycles" class="metric-list"></div>
        </section>

        <section class="panel-card compact-card wide-card">
          <div class="panel-label">分析摘要</div>
          <div id="summaryList" class="summary-list"></div>
        </section>

        <section class="panel-card risk-card wide-card">
          <div class="panel-label">风险提示</div>
          <p>江恩理论输出和 AI 报告仅供研究与教学演示，不构成任何投资建议。</p>
        </section>
      </aside>
    </div>

    <div id="aiModal" class="modal-shell" aria-hidden="true">
      <div class="modal-backdrop" data-close-modal="true"></div>
      <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="aiModalTitle">
        <header class="modal-header">
          <div>
            <div class="panel-label">AI Workspace</div>
            <h2 id="aiModalTitle">江恩理论 AI 分析报告</h2>
          </div>
          <div class="modal-header-actions">
            <button id="closeAiModalBtn" type="button" class="icon-btn" aria-label="关闭">×</button>
          </div>
        </header>

        <div class="modal-body">
          <section class="modal-side">
            <div class="panel-card modal-panel">
              <div class="panel-label">模型配置</div>
              <div class="form-stack">
                <label>
                  Base URL
                  <input id="llmBaseUrlInput" type="text" placeholder="https://api.openai.com/v1" />
                </label>
                <label>
                  Model
                  <input id="llmModelInput" type="text" placeholder="gpt-4o-mini" />
                </label>
                <label>
                  API Key
                  <input id="llmApiKeyInput" type="password" placeholder="sk-..." />
                </label>
                <label>
                  Temperature
                  <input id="llmTemperatureInput" type="number" min="0" max="2" step="0.1" value="0.4" />
                </label>
                <label>
                  System Prompt
                  <textarea id="llmSystemPromptInput" rows="6" placeholder="用于约束模型输出风格和研究口径"></textarea>
                </label>
              </div>
            </div>

            <div class="panel-card modal-panel">
              <div class="panel-label">操作</div>
              <div class="button-row stacked-row">
                <button id="generateAiReportBtn" type="button" class="primary-btn wide-btn">生成 AI 报告</button>
                <button id="exportAiPdfBtn" type="button" class="ghost-btn wide-btn">导出 PDF</button>
              </div>
              <div id="aiMeta" class="mini-meta">未生成</div>
            </div>
          </section>

          <section class="modal-report-wrap">
            <div class="panel-card modal-panel report-panel">
              <div class="panel-label">报告结果</div>
              <div id="aiReportPrintable" class="report-printable">
                <div class="report-head">
                  <h3 id="aiReportTitle">AI 江恩分析报告</h3>
                  <p id="aiReportSubtitle">配置 OpenAI 兼容接口后，点击“生成 AI 报告”。</p>
                </div>
                <pre id="aiReportContent" class="report-box">配置 OpenAI 兼容接口后，点击“生成 AI 报告”。</pre>
              </div>
            </div>
          </section>
        </div>
      </section>
    </div>

    <template id="metricItemTemplate">
      <div class="metric-item">
        <span class="metric-name"></span>
        <span class="metric-value"></span>
      </div>
    </template>

    <script src="/app.js"></script>
  </body>
</html>
